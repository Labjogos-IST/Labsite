[[params.sections.events.items]]
badge = "GGJ"
title = "Global Game Jam"
desc = "Global Game Jam brings together programmers, artists, musicians, game designers and other video game lovers with the goal of developing a game in 48 hours."
image = "images/events/ggj.jpg"
link = "/events/global-game-jam/"
# badge_style = "bg-red-500 text-white"

[[params.sections.events.items]]
badge = "Mojo"
# badge_style = "bg-primary-100 dark:bg-primary-950 text-primary-600 dark:text-primary-400"
title = "Montra de Jogos"
desc = "Montra de Jogos (MOJO) is an annual game showcase of what is best produced in the area of games by the IST community."
image = "images/events/mojo.jpg"
link = "/events/global-game-jam/"

[[params.sections.events.items]]
badge = "Alumni Meets"
# badge_style = "bg-secondary-100 dark:bg-secondary-950 text-secondary-600 dark:text-secondary-400"
