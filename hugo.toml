# ==========================================
# MARKUP AND ENGINE PRIVACY SETTINGS
# ==========================================

[taxonomies]
category = "Categories"
tag = "Tags"

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = "https"
strikethrough = true
table = true
taskList = true

[markup.goldmark.extensions.typographer]
apostrophe = "&rsquo;"
disable = false
ellipsis = "&hellip;"
emDash = "&mdash;"
enDash = "&ndash;"
leftAngleQuote = "&laquo;"
leftDoubleQuote = "&ldquo;"
leftSingleQuote = "&lsquo;"
rightAngleQuote = "&raquo;"
rightDoubleQuote = "&rdquo;"
rightSingleQuote = "&rsquo;"

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"
wrapStandAloneImageWithinParagraph = true

[markup.goldmark.parser.attribute]
block = false
title = true

[markup.goldmark.renderer]
hardWraps = false
unsafe = false
xhtml = false

[privacy.disqus]
disable = true

[privacy.googleAnalytics]
disable = true

[privacy.instagram]
disable = true

[privacy.x]
disable = true
enableDNT = false
simple = false

[privacy.vimeo]
disable = true

[privacy.youtube]
disable = true
privacyEnhanced = true

[module.hugoVersion]
extended = true
min = "0.148.2"