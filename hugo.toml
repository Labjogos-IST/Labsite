description_en = "The Game Lab at Instituto Superior Técnico (Universidade de Lisboa) is a dedicated space for game design, development, academic research, and student collaboration."
description_pt = "O Laboratório de Jogos no Instituto Superior Técnico (Universidade de Lisboa) é um espaço dedicado ao design de jogos, desenvolvimento, investigação académica e colaboração de estudantes."

