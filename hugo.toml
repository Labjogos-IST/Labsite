baseURL = "https://labjogos.tecnico.ulisboa.pt/"
title = "Labjogos"
theme = "tailbliss"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
contentDir = "content"

[languages]
[languages.en]
languageName = "English"
locale = "en-GB"
contentDir = "content/en"
weight = 1

[languages.pt]
languageName = "Português"
locale = "pt-PT"
contentDir = "content/pt"
weight = 2

enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
canonifyURLs = false
darkmode_js = ["assets/js/darkmode.js"]
enableInlineShortcodes = true

[pagination]
pagerSize = 9

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = "https"
strikethrough = true
table = true
taskList = true

[markup.goldmark.extensions.typographer]
apostrophe = "&rsquo;"
disable = false
ellipsis = "&hellip;"
emDash = "&mdash;"
enDash = "&ndash;"
leftAngleQuote = "&laquo;"
leftDoubleQuote = "&ldquo;"
leftSingleQuote = "&lsquo;"
rightAngleQuote = "&raquo;"
rightDoubleQuote = "&rdquo;"
rightSingleQuote = "&rsquo;"

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"
wrapStandAloneImageWithinParagraph = true

[markup.goldmark.parser.attribute]
block = false
title = true

[markup.goldmark.renderer]
hardWraps = false
unsafe = false
xhtml = false

[params]
favicon = "/images/favicon.ico"
author = "Laboratório de Jogos"
# authorimage = "images/global/logo-ist.png"
og_image = "/images/logo.svg"
logo = "/images/logo.svg"
authorimage = "/images/logo.svg"
moto = ""
description = "The Game Lab at Instituto Superior Técnico (Universidade de Lisboa) is a dedicated space for game design, development, academic research, and student collaboration."
disable_theme_toggle = false
disable_stay_uptodate = true
badge = "Made with hate by Obama."

[params.sections.about]
heading = "About"
paragraphs = [
  "The Game Lab is a space at the Alameda Campus of Instituto Superior Técnico (Universidade de Lisboa) dedicated to the development of academic projects in the field of Digital Games.",
  "This space aims to host student groups for project discussions, support test sessions and evaluations with users, and display projects carried out within the scope of courses such as Game Design, Virtual Reality, and Autonomous Agents."
]

[[params.sections.about.cards]]
title = "Education"
style = "bg-zinc-900 text-white text-primary-400 text-zinc-200 text-zinc-400"
text = "LabJogos offers multiple courses in the Specialization on Games in Instituto Superior Técnico and holds several Master Thesis and research projects in the fields of Games and Interactive Experiences."
image = "/images/about/education.png"
# link = "/education"

[params.sections.about.cards.button]
label = "See courses"
link = "/education"

[[params.sections.about.cards]]
title = "Mission"
style = "bg-primary-600 text-white text-zinc-900 text-zinc-100 text-zinc-200"
text = "LabJogos promotes the values of Games, bridging the gap between Academia, Industry, and Society. As a continued mission to help spread knowledge on game development in and out of Instituto Superior Técnico, LabJogos promotes a range of events throughout the year."
image = "/images/about/mission.png"

[params.sections.about.cards.button]
label = "See More"
link = "/mission"

[[params.sections.about.cards]]
title = "Inovation"
style = "bg-zinc-100 dark:bg-zinc-900 text-zinc-900 dark:text-white text-secondary-500 text-zinc-600 dark:text-zinc-400 text-zinc-400"
text = "At LabJogos we support innovation in game creation by offering multidisciplinary teams to develop games with the help of Fine Arts students."
image = "/images/about/innovation.png"

[params.sections.education]
heading = "Education"
images = [
  "images/education/showcase01.jpg",
  "images/education/showcase02.jpg",
]

[[params.sections.education.items]]
title = "Foundations of Game Design"

[[params.sections.education.items]]
title = "Foundations of Game Design"
desc = "Introduction to core mechanics, design loops, and world balancing blueprints."

[[params.sections.education.items]]
title = "Game Design"
desc = "Mechanics architecture, behavioral loops, player metrics, and rules systems layouts."

[[params.sections.education.items]]
title = "Virtual Reality"
desc = "Immersive hardware pipelines, head-tracking spaces, and spatial rendering interaction loops."

[[params.sections.education.items]]
title = "Autonomous Agents"
desc = "Behavior trees, utility models, paths layouts, and procedural AI response metrics."

[[params.sections.education.items]]
title = "Thesis Projects"
desc = "Advanced academic research, game engines integration, and experimental graphics evaluation."

