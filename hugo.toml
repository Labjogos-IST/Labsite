[languages.pt.params]
description = "O Laboratório de Jogos no Instituto Superior Técnico (Universidade de Lisboa) é um espaço dedicado ao design de jogos, desenvolvimento, investigação académica e colaboração de estudantes."
badge = "Made with hate by Obama."
moto = ""

[languages.pt.params.sections.about]
heading = "Sobre Nós"
paragraphs = [
  "O LabJogos é um espaço no Campus da Alameda do Instituto Superior Técnico (Universidade de Lisboa) dedicado ao desenvolvimento de projetos académicos na área dos Jogos Digitais.",
  "Este espaço visa acolher grupos de estudantes para discussões de projetos, apoiar sessões de testes e avaliações com utilizadores, e expor projetos realizados no âmbito de disciplinas como Design de Jogos, Realidade Virtual e Agentes Autónomos."
]

[[languages.pt.params.sections.about.cards]]
title = "Educação"
style = "bg-zinc-900 text-white text-primary-400 text-zinc-200 text-zinc-400"
text = "No que toca a educação, o LabJogos oferece 6 cursos de Especialização em Jogos e realiza várias Teses de Mestrado e projectos de investigação nos campos dos Jogos e das Experiências Interactivas."
image = "/images/about/education.png"

[languages.pt.params.sections.about.cards.button]
label = "Ver cursos"
link = "education"

[[languages.pt.params.sections.about.cards]]
title = "Missão"
style = "bg-primary-600 text-white text-zinc-900 text-zinc-100 text-zinc-200"
text = "O LabJogos promove os valores dos Jogos, ultrapassando a distância entre a Academia, a Indústria e a Sociedade. Como missão contínua de ajudar a difundir o conhecimento sobre o desenvolvimento de jogos dentro e fora do Instituto Superior Técnico, o LabJogos promove uma série de eventos ao longo do ano."
image = "/images/about/mission.png"

[languages.pt.params.sections.about.cards.button]
label = "Ver Mais"
link = "mission"

[[languages.pt.params.sections.about.cards]]
title = "Inovação"
