badge_pt = "Feito com X"

moto_en = ""
moto_pt = ""

# --- About Section ---
[params.sections.about]
heading_en = "About"
heading_pt = "Sobre"

[[params.sections.about.cards]]
title_en = "Education"
title_pt = "Educação"
text_en = "LabJogos offers multiple courses in the Specialization on Games in Instituto Superior Técnico and holds several Master Thesis and research projects in the fields of Games and Interactive Experiences."
text_pt = "No que toca a educação, o LabJogos oferece vários cursos na Especialização em Jogos no Instituto Superior Técnico e realiza várias Teses de Mestrado e projectos de investigação nos campos dos Jogos e das Experiências Interactivas."
button_label_en = "See courses"
button_label_pt = "Ver cursos"
button_link = "education"
image = "/images/about/education.png"

[[params.sections.about.cards]]
title_en = "Mission"
title_pt = "Missão"
text_en = "LabJogos promotes the values of Games, bridging the gap between Academia, Industry, and Society. As a continued mission to help spread knowledge on game development in and out of Instituto Superior Técnico, LabJogos promotes a range of events throughout the year."
text_pt = "O LabJogos promove os valores dos Jogos, fazendo a ponte entre a Academia, a Indústria e a Sociedade. Como missão contínua de ajudar a difundir o conhecimento sobre o desenvolvimento de jogos dentro e fora do Instituto Superior Técnico, o LabJogos promove uma série de eventos ao longo do ano."
button_label_en = "See More"
button_label_pt = "Ver Mais"
button_link = "mission"
image = "/images/about/mission.png"

[[params.sections.about.cards]]
title_en = "Innovation"
title_pt = "Inovação"
text_en = "At LabJogos we support innovation in game creation by offering multidisciplinary teams to develop games with the help of Fine Arts students."
text_pt = "No LabJogos apoiamos a inovação na criação de jogos através da oferta de equipas multidisciplinares para o desenvolvimento dos mesmos com ajuda dos alunos de Belas Artes."
image = "/images/about/innovation.png"


