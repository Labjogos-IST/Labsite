# --- Events Section ---
[[params.sections.events.items]]
badge = "GGJ"
title_en = "Global Game Jam"
title_pt = "Global Game Jam"
desc_en = "Global Game Jam brings together programmers, artists, musicians, game designers and other video game lovers with the goal of developing a game in 48 hours."
desc_pt = "A Global Game Jam junta programadores, artistas, músicos, game designers e outros amantes de videojogos com o objectivo de desenvolver um jogo em 48 horas."
image = "images/events/ggj.jpg"
link = "/events/ggj/"

[[params.sections.events.items]]
badge = "Mojo"
title_en = "Montra de Jogos"
title_pt = "Montra de Jogos"
desc_en = "Montra de Jogos (MOJO) is an annual game showcase of what is best produced in the area of games by the IST community."
desc_pt = "Montra de Jogos (MOJO) é uma exposição anual de jogos do que é melhor produzido na área pela comunidade do IST."
image = "images/events/mojo.jpg"
link = "/posts/mojo26.md"

[[params.sections.events.items]]
badge = "Alumni Meets"
title_en = "Alumni Meeting"
title_pt = "Alumni Meeting"
desc_en = "Annual conferences where past graduates working in premium studios share workflows."
desc_pt = "Conferências anuais onde ex-alunos que trabalham em estúdios de renome partilham fluxos de trabalho."
image = "images/events/alumni.jpg"
link = "/events/global-game-jam/"

[[params.sections.events.items]]
badge = "Talk N' Play"
title_en = "Talk N' Play"
title_pt = "Talk N' Play"
desc_en = "Talk n' Play is our most frequent event where we invite students to participate in a discussion of anything and everything games related."
desc_pt = "O Talk n' Play é o nosso evento mais frequente onde convidamos os estudantes a participar numa discussão sobre tudo e qualquer coisa relacionada com jogos."
image = "images/events/tnp.jpg"
link = "/events/global-game-jam/"


