[[params.sections.events.items]]
badge = "GGJ"
badge_style = "bg-primary-100 dark:bg-primary-950 text-primary-600 dark:text-primary-400"
title = "Global Game Jam"
desc = "Hosting the localized edition for immersive prototype development sessions over 48 hours."

[[params.sections.events.items]]
badge = "AM"
badge_style = "bg-secondary-100 dark:bg-secondary-950 text-secondary-600 dark:text-secondary-400"
title = "Alumni Meeting"
desc = "Annual conferences where past graduates working in premium studios share workflows."

[params.sections.partners]
heading = "Partners"
text = "Our active ecosystem, computing equipment, and collaborative research initiatives are closely backed and shared with our core institutional partners."
logos = [
  { name = "Instituto Superior Técnico", id = "ist" },
  { name = "INESC-ID", id = "inescid" },
  { name = "GAIPS", id = "gaips" }
]

[params.sections.connect]
heading = "Connect With Us"
action = "/contact/"
placeholder = "Enter your email"
button = "Submit"

[params.social_media]
[params.social_media.facebook]
enabled = true
url = "https://www.facebook.com/LabJogosIST"

[params.social_media.instagram]
enabled = true
url = "https://instagram.com/labjogos"

