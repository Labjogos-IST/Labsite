{{ define "main" }}
<main id="main">
    <div class="max-w-screen-xl px-4 py-8 mx-auto lg:py-16 lg:px-6">
        <div class="max-w-screen-sm mx-auto text-center">
            <h1 class="mb-4 font-black tracking-tight capitalize text-8xl lg:text-7xl xl:text-9xl text-[var(--site-text-primary)]">
                404
            </h1>
            <p class="mb-6 text-3xl font-bold tracking-tight text-[var(--site-text-secondary)] md:text-4xl">
                Página não encontrada, confirme o URL ou tente mais tarde.
            </p>
            <a href="/"
                class="inline-flex text-[var(--color-white)] bg-[var(--color-archive-blue)] hover:opacity-90 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center my-4 transition-opacity">
                Voltar ao início
            </a>
        </div>
    </div>
</main>
{{ end }}
